model:
  width: 256
  depth: 8
  heads: 4
  text_depth: 3
  patch_size: 2
  latent_dim: 128
train:
  steps: 200000
  batch_size: 16
  accumulation: 2
  learning_rate: 0.0003
  warmup: 5000
  weight_decay: 0.01
  ema_decay: 0.999
  precision: bf16
  workers: 4
  checkpoint_every: 2000
  validate_every: 1000
  log_every: 50
  grad_checkpoint: false
  compile: false
  seed: 42
