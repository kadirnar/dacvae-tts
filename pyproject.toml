[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dacvae-tts"
version = "0.1.0"
description = "Compact English reference-conditioned flow TTS in DACVAE latent space"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5,<3",
    "torchaudio>=2.5,<3",
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.12",
    "PyYAML>=6",
    "tqdm>=4.66",
    "pyarrow>=18",
    "pyloudnorm>=0.1",
    "huggingface_hub>=0.25",
    "dacvae @ git+https://github.com/facebookresearch/dacvae.git@414c20785fc3a28373073ea8ef7a1316eeeaca6e",
    "faster-whisper>=1.1",
    "onnxruntime>=1.19",
    "transformers>=4.46,<5",
    "wandb>=0.18",
    "protobuf<7",  # wandb <= 0.25 ships protobuf v3-v6 bindings only; onnx would otherwise pull 7.x
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
# Kept as aliases for older commands in the docs; everything is already in `dependencies`.
codec = []
eval = []
data = []
asr = []
tracking = []

[project.scripts]
dacvae-tts = "dacvae_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dacvae_tts = ["*.json"]

[tool.setuptools.data-files]
"share/dacvae-tts/licenses/fast-dacvae" = ["third_party/fast-dacvae/LICENSE"]
"share/dacvae-tts/licenses/unispeech" = ["third_party/unispeech/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
