[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dacvae-tts"
version = "0.1.0"
description = "Compact English reference-conditioned flow TTS in DACVAE latent space"
requires-python = ">=3.10,<3.13"
dependencies = ["torch>=2.5,<3", "torchaudio>=2.5,<3", "numpy>=1.26", "soundfile>=0.12", "scipy>=1.12", "PyYAML>=6", "tqdm>=4.66"]

[project.optional-dependencies]
codec = ["dacvae @ git+https://github.com/facebookresearch/dacvae.git@414c20785fc3a28373073ea8ef7a1316eeeaca6e"]
# Keep the evaluator environment compatible with descript-audiotools (DACVAE).
eval = ["faster-whisper>=1.1", "onnxruntime>=1.19", "transformers>=4.46,<5", "protobuf>=3.9.2,<3.20"]
dev = ["pytest>=8", "ruff>=0.9"]
data = ["pyarrow>=18"]
asr = ["faster-whisper>=1.1"]

[project.scripts]
dacvae-tts = "dacvae_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
