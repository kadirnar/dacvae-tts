# Pilot: 4 shards (~21 h) on one GPU to validate the Turkish pipeline end to end.
model:
  width: 448
  depth: 12
  heads: 7
  text_depth: 4
  text_attention: 4
  patch_size: 1
  latent_dim: 128
  positions: rope
  qk_norm: true
  prediction: edm
  text_layout: joined
  duration: rule
  cond_dropout: 0.2
  ctc_layer: 8
  adaln_rank: 64
train:
  steps: 12000
  batch_size: 96
  accumulation: 1
  learning_rate: 0.0008
  warmup: 1000
  weight_decay: 0.01
  optimizer: muon
  muon_momentum: 0.95
  ema_decay: 0.9999
  precision: bf16
  workers: 4
  prefetch_factor: 4
  checkpoint_every: 1000
  keep_every: 2000
  validate_every: 500
  log_every: 100
  grad_checkpoint: true    # eager on 24 GB needs recomputation at frame budget 12000
  compile: false           # generator-only compile spent >15 min on the first step here (dynamic-shape recompiles); eager + checkpointing instead
  seed: 42
  flow_reduction: frame
  pairing: within
  prompt_fraction_min: 0.1
  prompt_fraction_max: 0.6
  prompt_dropout: 0.3
  time_sampling: logit_normal
  batch_expansion: 2
  ctc_weight: 0.1
  contrastive_weight: 0.2
  contrastive_margin: 0.1
  wandb_project: dacvae-tts-tr
