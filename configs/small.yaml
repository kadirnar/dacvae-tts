model:
  width: 384
  depth: 12
  heads: 6
  text_depth: 4
  patch_size: 2
  latent_dim: 128
train:
  steps: 300000
  batch_size: 8
  accumulation: 4
  learning_rate: 0.0002
  warmup: 7500
  weight_decay: 0.01
  optimizer: muon
  muon_momentum: 0.95
  ema_decay: 0.999
  precision: bf16
  workers: 4
  checkpoint_every: 2000
  validate_every: 1000
  log_every: 50
  grad_checkpoint: true
  compile: false
  seed: 42
