# A/B: nano_tr_w512 + prompt tempo perturbation, the only change (0 parameters; data only).
# With probability 0.3 the within-utterance prompt is the same speech at tempo x0.8/0.9/1.0/1.111/1.25 (WSOLA-stretched
# audio re-encoded by DACVAE; x1.0 is the re-encoded round trip), the target unchanged: training then sees prompt/target
# rate mismatches, which the length-aware RoPE prior meets whenever the duration rule misses the prompt's rate.
# VoiceStar (arXiv:2505.19462): +0.25 tempo on cross prompts, WER 6.42 -> 5.66, SIM -0.004. Prerequisite (once per cache,
# ~5x the cache's latent size):
#   python scripts/build_tempo_variants.py build --cache C --output C/tempo/wsola-v1 --device cuda
# Combine with experiments/tr_w512_pairs.yaml (cross prompts) and tempo_prompt_pairs: cross for VoiceStar's exact setting.
# Compare at 20k with the baseline at seeds 42/43: Freya CER/WER, and WER over a duration-scale sweep (x0.8-x1.2).
model:
  width: 512
  depth: 12
  heads: 8
  text_depth: 4
  text_attention: 4
  patch_size: 1
  latent_dim: 128
  positions: rope
  qk_norm: true
  prediction: edm
  text_layout: joined
  duration: rule
  cond_dropout: 0.2
  ctc_layer: 8
  adaln_rank: 64
train:
  steps: 60000
  batch_size: 96
  accumulation: 1
  learning_rate: 0.0008
  warmup: 2000
  weight_decay: 0.01
  optimizer: muon
  muon_momentum: 0.95
  ema_decay: 0.9999
  precision: bf16
  workers: 4
  prefetch_factor: 4
  checkpoint_every: 1000
  keep_every: 5000
  validate_every: 1000
  log_every: 100
  grad_checkpoint: true    # eager on 24 GB needs recomputation at frame budget 12000
  compile: false           # generator-only compile spent >15 min on the first step here (dynamic-shape recompiles); eager + checkpointing instead
  seed: 42
  flow_reduction: frame
  pairing: within
  prompt_fraction_min: 0.1
  prompt_fraction_max: 0.6
  prompt_dropout: 0.3
  time_sampling: logit_normal
  batch_expansion: 4       # run B (Ke=4) led run A (Ke=2) by 0.02-0.04 WER at 25k-30k updates and kept SIM higher
  ctc_weight: 0.1
  contrastive_weight: 0.2
  contrastive_margin: 0.1
  wandb_project: dacvae-tts-tr
  tempo_prompt_prob: 0.3
  tempo_variants: tempo/wsola-v1
