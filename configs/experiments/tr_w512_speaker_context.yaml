# A/B: nano_tr_w512 + a multi-clip speaker context, the only change (+2.24M parameters, +3.4 %: a 3 x 256 set
# transformer over other recordings of the voice -> attention pooling -> a zero-init vector in the voice condition).
# Half of the items get 3-30 s of other utterances of their label (whole clips); the others none, so single-clip
# inference stays in distribution. At inference the context is the prompt plus any --context-audio clips.
# Evidence is from large models only: Irodori-TTS v4 (766M) CAM++ SIM single clip 0.661 -> 30 s 0.752 -> 120 s 0.775;
# Koel-TTS saw a cross-attention encoder overfit seen speakers (unseen 0.601 vs in-context 0.637), hence one vector.
# Zero-init: the branch starts as the baseline, so it may also warm-start from run C (--init-from step-0060000.pt).
# Compare at 20k with the baseline at seeds 42/43 on UNSEEN speakers (held-out programs / --prompt-set): SIM-o with
# 0 / 10 / 30 s of context clips, WER/CER as the gate; a train-speaker gain far above the val gain means overfitting.
model:
  width: 512
  depth: 12
  heads: 8
  text_depth: 4
  text_attention: 4
  patch_size: 1
  latent_dim: 128
  positions: rope
  qk_norm: true
  prediction: edm
  text_layout: joined
  duration: rule
  cond_dropout: 0.2
  ctc_layer: 8
  adaln_rank: 64
  speaker_context: vector
train:
  steps: 60000
  batch_size: 96
  accumulation: 1
  learning_rate: 0.0008
  warmup: 2000
  weight_decay: 0.01
  optimizer: muon
  muon_momentum: 0.95
  ema_decay: 0.9999
  precision: bf16
  workers: 4
  prefetch_factor: 4
  checkpoint_every: 1000
  keep_every: 5000
  validate_every: 1000
  log_every: 100
  grad_checkpoint: true    # eager on 24 GB needs recomputation at frame budget 12000
  compile: false           # generator-only compile spent >15 min on the first step here (dynamic-shape recompiles); eager + checkpointing instead
  seed: 42
  flow_reduction: frame
  pairing: within
  prompt_fraction_min: 0.1
  prompt_fraction_max: 0.6
  prompt_dropout: 0.3
  time_sampling: logit_normal
  batch_expansion: 4       # run B (Ke=4) led run A (Ke=2) by 0.02-0.04 WER at 25k-30k updates and kept SIM higher
  ctc_weight: 0.1
  contrastive_weight: 0.2
  contrastive_margin: 0.1
  wandb_project: dacvae-tts-tr
  speaker_context_prob: 0.5
